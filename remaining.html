<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ကျန်ဂဏန်း</title><style>body{font-family:Arial;margin:0;background:#fff;color:#000}main{max-width:600px;margin:auto;padding:20px}.card{border:2px solid #000;padding:18px;margin-top:15px;box-shadow:3px 3px #000}.digits{font-size:28px;font-weight:bold;letter-spacing:12px;margin-top:15px}.back{display:inline-block;margin-top:20px;background:#000;color:#fff;padding:10px 15px;text-decoration:none}</style></head><body><main><h1>ကျန်ဂဏန်း</h1><div class="card"><b>ဒီအပတ် (Monday – Friday)</b><div id="status">Loading...</div><div class="digits" id="remaining">--</div></div><a class="back" href="/">Back to Home</a></main><script>async function load(){try{let r=await fetch("/api/live?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json(),days=d.result||[],used=new Set();days.forEach(x=>{let n=String(x.twod||"");if(/^\d{2}$/.test(n)){used.add(n[0]);used.add(n[1])}});let left=[];for(let i=0;i<=9;i++)if(!used.has(String(i)))left.push(i);document.getElementById("remaining").textContent=left.length?left.join("  "):"မရှိပါ";document.getElementById("status").textContent="ထွက်ပြီးသော digit: "+Array.from(used).sort().join(", ");}catch(e){document.getElementById("status").textContent="Error: "+e.message}}load();</script></body></html>
