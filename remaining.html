<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>တစ်ပတ်စာ ကျန်ဂဏန်း</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--ink:#161618;--line:#dedee4;--green:#16783b;--red:#b52e36} [data-theme=dark]{--bg:#000;--card:#1c1c1e;--ink:#fff;--line:#414145;--green:#65d68b;--red:#ff858b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:20px 16px}main{max-width:440px;margin:auto}a{color:inherit;text-decoration:none}h1{font-size:22px}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}h2{font-size:17px;margin:0 0 14px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.num{border:1px solid currentColor;border-radius:10px;text-align:center;padding:12px 0;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}#remaining{color:var(--green)}#draws{color:var(--red)}#status,#week{font-size:13px;line-height:1.6}.empty{grid-column:1/-1}button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
</style></head><body><main><a href="/index.html">← ပင်မစာမျက်နှာ</a><h1>တစ်ပတ်စာ ကျန်ဂဏန်း</h1><p id="week"></p><p id="status" role="status">ဒေတာ ရယူနေပါသည်…</p><section><h2>ကျန်ဂဏန်း <span id="remainingCount"></span></h2><div class="grid" id="remaining"></div></section><section><h2>ထွက်ပြီးဂဏန်း <span id="drawCount"></span></h2><div class="grid" id="draws"></div></section><button id="refresh">Refresh</button></main>
<script>
const zone='Asia/Yangon';
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function clock(now=new Date()){const p=Object.fromEntries(fmt.formatToParts(now).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,minute:+p.hour*60 + +p.minute};}
function weekDays(date){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return Array.from({length:5},(_,i)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+i);return x.toISOString().slice(0,10)});}
function calculate(draws){const used=new Set(draws.flatMap(x=>x.split('')));return Array.from('0123456789').filter(x=>!used.has(x));}
function parseDay(data,date,now){if(!Array.isArray(data))throw Error('Invalid history');const draws=new Map();for(const row of data){if(!row||!Array.isArray(row.child))throw Error('Invalid history row');for(const c of row.child){const stamp=String(c.stock_datetime||row.date||'').slice(0,10);if(stamp!==date)continue;const t=String(c.open_time||c.time||'').slice(0,5);if(!['12:01','16:30'].includes(t))continue;if(date===now.date&&now.minute<(t==='12:01'?721:990))continue;const raw=String(c.twod??'').trim();if(!/^\d{1,2}$/.test(raw))continue;draws.set(t,raw.padStart(2,'0'));}}return ['12:01','16:30'].filter(t=>draws.has(t)).map(t=>draws.get(t));}
function render(id,values,empty){const el=document.getElementById(id);el.replaceChildren();if(!values.length){const n=document.createElement('div');n.className='empty';n.textContent=empty;el.append(n);return;}for(const v of values){const n=document.createElement('div');n.className='num';n.textContent=v;el.append(n);}}
let busy=false,lastWeek='';async function load(){if(busy)return;busy=true;const now=clock(),days=weekDays(now.date),key=days[0];document.getElementById('week').textContent=key+' — '+days[4]+' (Myanmar Time)';if(key!==lastWeek){render('remaining',[],'—');render('draws',[],'—');document.getElementById('remainingCount').textContent='';document.getElementById('drawCount').textContent='';lastWeek=key;}try{const dates=days.filter(d=>d<=now.date&&!(d===now.date&&now.minute<721));const results=await Promise.all(dates.map(async d=>{const res=await fetch('/api/history?date='+encodeURIComponent(d),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);return parseDay(await res.json(),d,now);}));if(weekDays(clock().date)[0]!==key)return;const draws=results.flat(),remaining=calculate(draws);render('remaining',remaining,'ကုန်ပါပြီ');render('draws',draws,'မရှိသေးပါ');document.getElementById('remainingCount').textContent=remaining.length+'/10';document.getElementById('drawCount').textContent=draws.length+' ကြိမ်';document.getElementById('status').textContent='နောက်ဆုံးစစ်ဆေးချိန် '+new Date().toLocaleTimeString('en-GB',{timeZone:zone});}catch(e){document.getElementById('status').textContent='ဒေတာ ရယူ၍မရပါ။ ပြထားသောဂဏန်းများ မပြည့်စုံနိုင်ပါ။';}finally{busy=false;}}
try{document.documentElement.dataset.theme=localStorage.getItem('darkMode')==='on'?'dark':'light'}catch(e){}document.getElementById('refresh').onclick=load;document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});load();setInterval(()=>{if(!document.hidden)load()},30000);
</script></body></html>
