<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2D History</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--bg:#fff;--text:#111;--line:#aaa;--head:#111;--headtext:#fff;--sub:#666} :root.dark{color-scheme:dark;--bg:#111;--text:#fff;--line:#555;--head:#292929;--headtext:#fff;--sub:#bbb} body{margin:0;padding:16px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)} main{max-width:600px;margin:auto} header{display:flex;align-items:center;justify-content:space-between} a{color:inherit;text-decoration:none;font-size:24px} h1{font-size:25px;text-align:center} .nav{display:flex;gap:8px;margin:8px 0 16px} button,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0} button:disabled{opacity:.35} input{flex:1;width:100%;text-align:center} .table{border:1px solid var(--line);border-radius:8px;overflow:hidden} .row{display:grid;grid-template-columns:1.25fr repeat(4,1fr);border-bottom:1px solid var(--line)} .row:last-child{border-bottom:0}.cell{padding:11px 3px;text-align:center;border-right:1px solid var(--line);font-size:14px}.cell:last-child{border-right:0}.head{font-weight:bold;background:var(--head);color:var(--headtext)}.twod{font-weight:bold;font-size:16px}.status{text-align:center;font-size:13px;color:var(--sub);margin:12px 0;min-height:20px}.loading{padding:20px;text-align:center} #retry{display:block;margin:12px auto} #retry[hidden]{display:none}
</style></head><body><main><header><a href="/index.html" aria-label="Back">←</a><h1>2D History</h1><a href="/settings.html" aria-label="Settings">⚙️</a></header>
<div class="nav"><button id="prev" aria-label="Previous month">‹</button><input type="month" id="month" aria-label="Select month"><button id="next" aria-label="Next month">›</button></div><div id="label" class="status"></div><div class="table"><div class="row head"><div class="cell">Date</div><div class="cell">11:00</div><div class="cell">12:01</div><div class="cell">15:00</div><div class="cell">16:30</div></div><div id="history"></div></div><div id="status" class="status" role="status"></div><button id="retry" hidden>Retry</button></main>
<script>
try{document.documentElement.classList.toggle('dark',localStorage.getItem('darkMode')==='on')}catch(e){}
const $=id=>document.getElementById(id), month=$('month'), rows=$('history');
const slots=['11:00','12:01','15:00','16:30'];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Yangon',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((a,p)=>(a[p.type]=p.value,a),{});}
function todayISO(){const t=today();return `${t.year}-${t.month}-${t.day}`;}
const currentMonth=()=>todayISO().slice(0,7);
const monthKey=d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
month.max=currentMonth();month.value=currentMonth();
let generation=0, active;
function datesFor(key,limit){const [y,m]=key.split('-').map(Number), out=[];for(let d=1;d<=new Date(Date.UTC(y,m,0)).getUTCDate();d++){const dt=new Date(Date.UTC(y,m-1,d)), iso=dt.toISOString().slice(0,10);if(dt.getUTCDay()!==0&&dt.getUTCDay()!==6&&iso<=limit)out.push(iso);}return out;}
async function fetchDay(date,signal){const ctrl=new AbortController(), abort=()=>ctrl.abort();signal.addEventListener('abort',abort,{once:true});if(signal.aborted)ctrl.abort();const timer=setTimeout(abort,12000);try{const r=await fetch('/api/history?date='+encodeURIComponent(date),{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw Error('Invalid data');const values={};for(const group of data){if(!Array.isArray(group.child))continue;for(const item of group.child){const time=String(item.time||item.open_time||'').slice(0,5), stamp=String(item.stock_datetime||group.date||'');if(/^\d{4}-\d{2}-\d{2}/.test(stamp)&&stamp.slice(0,10)!==date)continue;const n=String(item.twod??'');if(slots.includes(time)&&/^\d{1,2}$/.test(n))values[time]=n.padStart(2,'0');}}return values;}finally{clearTimeout(timer);signal.removeEventListener('abort',abort);}}
function showRow(date){const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='cell';label.textContent=new Date(date+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});row.append(label);const cells=slots.map(()=>{const c=document.createElement('div');c.className='cell twod';c.textContent='…';row.append(c);return c;});rows.append(row);return cells;}
async function load(){if(!/^\d{4}-\d{2}$/.test(month.value))return;month.max=currentMonth();if(month.value>month.max)month.value=month.max;const key=month.value, token=++generation;if(active)active.abort();active=new AbortController();const signal=active.signal;const dates=datesFor(key,todayISO());$('next').disabled=key>=month.max;$('label').textContent=new Date(key+'-01T00:00:00Z').toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})+' · Myanmar Time';rows.replaceChildren();$('retry').hidden=true;let done=0,errors=0;const items=dates.map(date=>({date,cells:showRow(date)}));$('status').textContent=dates.length?'Loading 0 / '+dates.length:'No elapsed weekdays';let cursor=0;async function worker(){while(cursor<items.length&&!signal.aborted){const {date,cells}=items[cursor++];try{const data=await fetchDay(date,signal);if(token!==generation)return;cells.forEach((c,i)=>c.textContent=data[slots[i]]||'--');}catch(e){if(token!==generation)return;errors++;cells.forEach(c=>c.textContent='!');}done++;$('status').textContent=`Loading ${done} / ${dates.length}`;}}await Promise.all(Array.from({length:Math.min(4,items.length)},worker));if(token!==generation)return;$('status').textContent=errors?`${errors} day(s) could not load. Retry available.`:dates.length?'-- = no reported result':'No elapsed weekdays';$('retry').hidden=!errors;}
function step(n){const [y,m]=month.value.split('-').map(Number);month.value=monthKey(new Date(Date.UTC(y,m-1+n,1)));load();} $('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('retry').onclick=load;month.onchange=load;load();let observedMonth=currentMonth();function checkMonth(){const now=currentMonth();if(now===observedMonth)return;const follow=month.value===observedMonth;observedMonth=now;month.max=now;if(follow){month.value=now;load();}else $('next').disabled=month.value>=now;}setInterval(checkMonth,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkMonth()});
</script></body></html>
