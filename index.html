<script>
async function loadLive(){
try{
let response=await fetch("/api/live?t="+Date.now(),{cache:"no-store"});
console.log("STATUS",response.status);
let d=await response.json();
let l=d.live||{},r=d.result||[],b=d.bm2d||[];


document.getElementById("set").textContent=l.set||"--";
document.getElementById("value").textContent=l.value||"--";
document.getElementById("time").textContent=l.time||"--";
let updateTime=document.getElementById("updateTime");
let updateCheck=document.getElementById("updateCheck");

function bm(t,k){let x=b.find(a=>a.time===t);return x?x[k]||"--":"--";} document.getElementById("modern0930").textContent=bm("09:30 AM","modern"); document.getElementById("internet0930").textContent=bm("09:30 AM","internet"); document.getElementById("modern1400").textContent=bm("02:00 PM","modern"); document.getElementById("internet1400").textContent=bm("02:00 PM","internet"); let x0930=b.find(a=>a.time==="09:30 AM"),x1400=b.find(a=>a.time==="02:00 PM"); document.getElementById("date0930").textContent=x0930?" ("+x0930.date+")":""; document.getElementById("date0930i").textContent=x0930?" ("+x0930.date+")":""; document.getElementById("date1400").textContent=x1400?" ("+x1400.date+")":""; document.getElementById("date1400i").textContent=x1400?" ("+x1400.date+")":""; let now=new Date();
let today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
let confirmed=null;

for(let a of r){
 let ot=(a.open_time||"").slice(0,5);
 let dt=a.stock_datetime||"";

 if(!["12:01","16:30"].includes(ot)) continue;
 if(!a.twod || a.twod==="--" || !dt) continue;
 if(dt.slice(0,10)!==today) continue;

 let stamp=new Date(dt.replace(" ","T"));
 let age=(now-stamp)/60000;

 if(age>=0 && age<15){
   if(!confirmed || stamp>new Date((confirmed.stock_datetime||"").replace(" ","T"))){
     confirmed=a;
   }
 }
}

let twodEl=document.getElementById("twod");
let twodValue=confirmed ? confirmed.twod : (l.twod||"--");

twodEl.textContent=twodValue;

/* Blink LIVE only, stop when confirmed result is shown */
if(!confirmed && twodValue && twodValue!=="--"){
 twodEl.classList.add("blink");
}else{
 twodEl.classList.remove("blink");
}

document.getElementById("time").textContent =
 confirmed ? confirmed.stock_datetime+" ✓✓" : (l.time||"--");

function get(t){
let x=r.find(a=>{let o=(a.open_time||"").slice(0,5);return o===t.slice(0,5);});
return x?x.twod:"--";
}

document.getElementById("r1100").textContent=get("11:00:00");
document.getElementById("r1201").textContent=get("12:01:00");
document.getElementById("r1500").textContent=get("15:00:00");
document.getElementById("r1630").textContent=get("16:30:00");

}catch(e){
console.log("LIVE ERROR",e);
}
}

loadLive();
setInterval(loadLive,2000);
</script>

</script>
