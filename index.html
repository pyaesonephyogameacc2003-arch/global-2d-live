<div class="result"><b>16:30</b><div class="num" id="r1630">--</div></div>

<script>
let pollTimer=null;
let clockTimer=null;
let freeze=null; let recoveryStarted=false;

function startPolling(){
  if(pollTimer) return;
  loadLive();
  pollTimer=setInterval(loadLive,2000);
}

function stopPolling(){
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=null;
  }
}

function el(id){return document.getElementById(id);}

function saveFreeze(data){
  if(!data || !data.date) return;

  const freezeData = {
    date: String(data.date),
    set: String(data.set ?? '--'),
    value: String(data.value ?? '--'),
    twod: String(data.twod ?? '--'),
    time: String(data.time ?? '--'),
    r1201: String(data.r1201 ?? '--'),
    r1630: String(data.r1630 ?? '--'),
    r1100: String(data.r1100 ?? '--'),
    r1500: String(data.r1500 ?? '--')
  };

  freeze = freezeData;
  localStorage.setItem('twodFreeze', JSON.stringify(freezeData));
}

function readFreeze(){
  try{
    let x = JSON.parse(localStorage.getItem('twodFreeze') || 'null');

    if(
      x &&
      x.date &&
      x.set !== undefined &&
      x.value !== undefined &&
      x.twod !== undefined
    ){
      return x;
    }
  }catch(e){}

  return null;
}

function showFreeze(x){
  if(!x) return false;

  if(el('set')) el('set').textContent = x.set || '--';
  if(el('value')) el('value').textContent = x.value || '--';

  if(el('twod')) el('twod').textContent = x.twod || '--';
  if(el('time')) el('time').textContent = x.time || '--';

  if(el('r1201')) el('r1201').textContent = x.r1201 || '--';
  if(el('r1630')) el('r1630').textContent = x.r1630 || '--';
  if(el('r1100')) el('r1100').textContent = x.r1100 || '--';
  if(el('r1500')) el('r1500').textContent = x.r1500 || '--';

  if(el('twod')) el('twod').classList.remove('blink');

  return true;
}

function todayString(){
  let n = new Date();
  return n.getFullYear() + '-' +
    String(n.getMonth()+1).padStart(2,'0') + '-' +
    String(n.getDate()).padStart(2,'0');
}

async function loadLive(){
  try{
    let response = await fetch('/api/live?t='+Date.now(), {
      cache:'no-store'
    });

    if(!response.ok) throw new Error('API '+response.status);

    let d = await response.json();

    let l = d.live || {};
    let r = d.result || [];
    let b = d.bm2d || [];

    let now = new Date();
    let today = todayString();
    let minutes =
      now.getHours()*60 +
      now.getMinutes() +
      now.getSeconds()/60;

    /*
     * SET / VALUE
     * Normal live period: always update.
     */
    if(el('set')) el('set').textContent = l.set || '--';
    if(el('value')) el('value').textContent = l.value || '--';

    function bm(t,k){
      let x = b.find(a => a.time === t);
      return x ? (x[k] || '--') : '--';
    }

    if(el('modern0930'))
      el('modern0930').textContent = bm('09:30 AM','modern');

    if(el('internet0930'))
      el('internet0930').textContent = bm('09:30 AM','internet');

    if(el('modern1400'))
      el('modern1400').textContent = bm('02:00 PM','modern');

    if(el('internet1400'))
      el('internet1400').textContent = bm('02:00 PM','internet');

    let x0930 = b.find(a => a.time === '09:30 AM');
    let x1400 = b.find(a => a.time === '02:00 PM');

    if(el('date0930'))
      el('date0930').textContent = x0930 ? ' ('+x0930.date+')' : '';

    if(el('date0930i'))
      el('date0930i').textContent = x0930 ? ' ('+x0930.date+')' : '';

    if(el('date1400'))
      el('date1400').textContent = x1400 ? ' ('+x1400.date+')' : '';

    if(el('date1400i'))
      el('date1400i').textContent = x1400 ? ' ('+x1400.date+')' : '';

    /*
     * Today's results only.
     */
    let result12 = null;
    let result1630 = null;
    let result1100 = null;
    let result1500 = null;

    for(let a of r){
      let ot = (a.open_time || '').slice(0,5);
      let dt = a.stock_datetime || '';

      if(
        !a.twod ||
        a.twod === '--' ||
        !dt ||
        dt.slice(0,10) !== today
      ) continue;

      if(ot === '11:00') result1100 = a;
      if(ot === '12:01') result12 = a;
      if(ot === '15:00') result1500 = a;
      if(ot === '16:30') result1630 = a;
    }

    /*
     * 16:30 reached:
     * save ONE complete snapshot.
     */
    if(minutes >= 990 && result1630){

      saveFreeze({
        date: today,
        set: l.set || '--',
        value: l.value || '--',
        twod: result1630.twod,
        time: result1630.stock_datetime || '--',
        r1201: result12 ? result12.twod : '--',
        r1630: result1630.twod,
        r1100: result1100 ? result1100.twod : '--',
        r1500: result1500 ? result1500.twod : '--'
      });

      freeze = readFreeze();
    }

    /*
     * 00:00 - 08:59:
     * NEVER overwrite the frozen UI with API '--'.
     */
    if(minutes < 540){

      let f = readFreeze();

      if(f){
        freeze = f;
        showFreeze(f);
        return;
      }

      /*
       * Old freeze from another day must not be used.
       */
      localStorage.removeItem('twodFreeze');
      freeze = null;
    }

    /*
     * 09:00 - 16:29:
     * normal live display.
     */
    if(minutes >= 540 && minutes < 990){

      if(el('set')) el('set').textContent = l.set || '--';
      if(el('value')) el('value').textContent = l.value || '--';

      if(el('r1100'))
        el('r1100').textContent = result1100 ? result1100.twod : '--';

      if(el('r1201'))
        el('r1201').textContent = result12 ? result12.twod : '--';

      if(el('r1500'))
        el('r1500').textContent = result1500 ? result1500.twod : '--';

      if(el('r1630'))
        el('r1630').textContent = result1630 ? result1630.twod : '--';
    }

    /*
     * Main 2D display.
     */
    let confirmed = null;

    if(result1630 && minutes >= 990){
      confirmed = result1630;
    }else if(result12){
      let stamp = new Date(
        result12.stock_datetime.replace(' ','T')
      );

      let age = (now - stamp) / 60000;

      if(age >= 0 && age < 15)
        confirmed = result12;
    }

    let twodValue =
      confirmed ? confirmed.twod : (l.twod || '--');

    if(el('twod'))
      el('twod').textContent = twodValue;

    if(confirmed){

      if(el('time'))
        el('time').textContent =
          confirmed.stock_datetime + ' ✓✓';

      if(el('twod'))
        el('twod').classList.remove('blink');

    }else{

      if(el('time'))
        el('time').textContent = l.time || '--';

      if(l.twod && l.twod !== '--' && el('twod'))
        el('twod').classList.add('blink');
    }

    /*
     * 16:30 snapshot must remain visible even if API
     * subsequently returns incomplete data.
     */
    if(minutes >= 990){

      let f = readFreeze();

      if(f){
        freeze = f;
        showFreeze(f);
      }
    }

  }catch(e){

    console.log('LIVE ERROR',e);

    /*
     * API error:
     * use today's frozen snapshot instead of replacing
     * everything with '--'.
     */
    let f = readFreeze();

    if(f){
      freeze = f;
      showFreeze(f);
    }
  }
}

async function recoverFreeze(){
  if(recoveryStarted) return;
  recoveryStarted=true; if(el('time'))el('time').textContent='RECOVERY START';
  try{
    let response=await fetch('/api/live?t='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('API '+response.status);
    let d=await response.json(); if(el('time'))el('time').textContent='API OK';
    let r=d.result||[];
    let valid=r.filter(a=>a && a.twod && a.twod!=='--' && a.stock_datetime);
    if(!valid.length) return;
    let dates=[...new Set(valid.map(a=>a.stock_datetime.slice(0,10)))].sort();
    let date=dates[dates.length-1];
    let result12=null,result1630=null,result1100=null,result1500=null;
    for(let a of valid){
      if(a.stock_datetime.slice(0,10)!==date) continue;
      let ot=(a.open_time||'').slice(0,5);
      if(ot==='11:00') result1100=a;
      if(ot==='12:01') result12=a;
      if(ot==='15:00') result1500=a;
      if(ot==='16:30') result1630=a;
    }
    if(!result1630){if(el('time'))el('time').textContent='NO 1630';return;}
    saveFreeze({date:date,set:result1630.set||'--',value:result1630.value||'--',twod:result1630.twod,time:result1630.stock_datetime||'--',r1201:result12?result12.twod:'--',r1630:result1630.twod,r1100:result1100?result1100.twod:'--',r1500:result1500?result1500.twod:'--'});
    let f=readFreeze();
    if(f){freeze=f;showFreeze(f);if(el('time'))el('time').textContent='RECOVERY OK';}
  }catch(e){console.log('FREEZE RECOVERY ERROR',e);}
}

function runSchedule(){

  let n = new Date();

  let m =
    n.getHours()*60 +
    n.getMinutes() +
    n.getSeconds()/60;

  /*
   * 09:00 - 16:29
   * Live API polling.
   */
  if(m >= 540 && m < 990){

    localStorage.removeItem('twodFreeze');
    freeze = null;

    startPolling();
    return;
  }

  /*
   * 16:30+
   * Fetch once to capture the final 16:30 result,
   * then STOP polling.
   */
  if(m >= 990){

    stopPolling();

    let f = readFreeze();

    if(!f){
      loadLive();
    }else{
      freeze = f;
      showFreeze(f);
    }

    return;
  }

  /*
   * 00:00 - 08:59
   * No API polling.
   * Show today's frozen snapshot.
   */
  stopPolling();

  let f = readFreeze();

  if(f){
    freeze = f;
    showFreeze(f);
  }else{
    loadLive();
  }
}

runSchedule();

clockTimer=setInterval(runSchedule,1000);

document.addEventListener('visibilitychange',()=>{

  if(document.visibilityState==='visible')runSchedule();

});

window.addEventListener('focus',runSchedule);

window.addEventListener('pageshow',runSchedule);

</script>
