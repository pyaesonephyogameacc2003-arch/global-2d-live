<style>
body{margin:0;background:#fff;color:#000;font-family:Arial,"Noto Sans Myanmar",sans-serif}

<script>
async function loadLive(){
try{
let response=await fetch("/api/live?t="+Date.now(),{cache:"no-store"});
console.log("STATUS",response.status);
let d=await response.json();
let l=d.live||{},r=d.result||[],b=d.bm2d||[];

document.getElementById("twod").textContent=l.twod||"--";
document.getElementById("set").textContent=l.set||"--";
document.getElementById("value").textContent=l.value||"--";
document.getElementById("time").textContent=l.time||"--";
let updateTime=document.getElementById("updateTime");
let updateCheck=document.getElementById("updateCheck");

function bm(t,k){let x=b.find(a=>a.time===t);return x?x[k]||"--":"--";} document.getElementById("modern0930").textContent=bm("09:30 AM","modern"); document.getElementById("internet0930").textContent=bm("09:30 AM","internet"); document.getElementById("modern1400").textContent=bm("02:00 PM","modern"); document.getElementById("internet1400").textContent=bm("02:00 PM","internet"); let x0930=b.find(a=>a.time==="09:30 AM"),x1400=b.find(a=>a.time==="02:00 PM"); document.getElementById("date0930").textContent=x0930?" ("+x0930.date+")":""; document.getElementById("date0930i").textContent=x0930?" ("+x0930.date+")":""; document.getElementById("date1400").textContent=x1400?" ("+x1400.date+")":""; document.getElementById("date1400i").textContent=x1400?" ("+x1400.date+")":""; let latest=r.length ? r[r.length-1] : null;
let updated=latest ? latest.stock_datetime : null;

if(updated){
 document.getElementById("time").textContent=updated;
 let confirmed=r.find(a=>(a.open_time==="12:01:00" || a.open_time==="16:30:00") && a.twod && a.twod!=="--"); document.getElementById("time").textContent=confirmed ? confirmed.stock_datetime+" ✓✓" : (l.time||"--");
}

function get(t){
let x=r.find(a=>(a.open_time||"").slice(0,5)===t.slice(0,5));
return x?x.twod:"--";
}

document.getElementById("r1100").textContent=get("11:00:00");
document.getElementById("r1201").textContent=get("12:01:00");
document.getElementById("r1500").textContent=get("15:00:00");
document.getElementById("r1630").textContent=get("16:30:00");

}catch(e){
console.log("LIVE ERROR",e);
}
}

loadLive();
setInterval(loadLive,2000);
</script>

</script>
